<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="bloque.css"></helmet>
<div style="position:relative; flex:none; overflow:hidden; box-sizing:border-box; width:{{ size }}px; height:{{ size }}px; border:{{ bw }}px solid var(--ink); border-radius:4px; background:{{ bg }}">
  <div style="position:absolute; left:0; top:0; width:120px; height:120px; transform:scale({{ k }}); transform-origin:0 0">
    <sc-for list="{{ parts }}" as="p" hint-placeholder-count="0"><div style="position:absolute; box-sizing:border-box; display:grid; place-items:center; left:{{ p.x }}px; top:{{ p.y }}px; width:{{ p.w }}px; height:{{ p.h }}px; background:{{ p.bg }}; border:{{ p.b }}; border-radius:{{ p.r }}; {{ p.css }}; color:var(--paper); font-family:var(--font-heading); font-weight:900; font-size:18px; line-height:1">{{ p.t }}</div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;skin&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b98660&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hair&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rapado&quot;,&quot;corto&quot;,&quot;rizos&quot;,&quot;trenzas&quot;,&quot;afro&quot;,&quot;mono&quot;,&quot;largo&quot;,&quot;cola&quot;,&quot;emo&quot;,&quot;trenza&quot;],&quot;default&quot;:&quot;corto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hairColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#17140f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;top&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tee&quot;,&quot;jersey&quot;,&quot;hoodie&quot;,&quot;guaya&quot;,&quot;polo&quot;,&quot;abierta&quot;],&quot;default&quot;:&quot;tee&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;topColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e5391b&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;chain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;earrings&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;pantallas&quot;,&quot;argollas&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glasses&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;streak&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;neck&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;choker&quot;,&quot;cruz&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#cfe6e2&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  // Bust drawn in a 120×120 box from flat outlined shapes (style of the avatar reference sheet), scaled to `size`.
  renderVals(){
    const p=this.props,size=Number(p.size)||96,bw=size<50?2:3,k=(size-2*bw)/120;
    const skin=p.skin||'#b98660',hc=p.hairColor||'var(--ink)',tc=p.topColor||'var(--color-accent)',hair=p.hair||'corto',top=p.top||'tee',ear=p.earrings||'none';
    const I='var(--ink)',L='2.5px solid '+I,T='transparent',N={b:'none'},parts=[];
    const P=(x,y,w,h,bg,r,o={})=>parts.push({x,y,w,h,bg,r:r||'0',b:o.b===undefined?L:o.b,css:o.css||'',t:o.t||''});
    const stripes=(dir)=>'repeating-linear-gradient('+dir+','+hc+' 0 5px,'+I+' 5px 7px)';
    // hair behind the head
    if(hair==='afro')P(14,6,92,78,hc,'50%');
    if(hair==='largo')P(25,24,70,72,hc,'32px 32px 8px 8px');
    if(hair==='trenzas'){P(24,46,11,52,stripes('180deg'),'5px');P(85,46,11,52,stripes('180deg'),'5px')}
    if(hair==='cola'){P(76,24,24,24,hc,'50%');P(82,42,22,22,hc,'50%');P(78,58,20,20,hc,'50%')}
    // neck and clothes
    P(51,70,18,22,skin);
    const shirt=top==='guaya'?'var(--color-surface)':tc;
    if(top==='hoodie')P(28,74,64,24,tc,'26px 26px 6px 6px');
    if(top==='jersey'){P(12,90,96,40,skin,'34px 34px 0 0');P(28,86,64,40,tc,'14px 14px 0 0',{css:'box-shadow:inset 0 4px 0 var(--paper)'})}
    else if(top==='abierta'){P(12,88,96,40,'var(--color-surface)','34px 34px 0 0');P(12,88,36,40,tc,'34px 0 0 0');P(72,88,36,40,tc,'0 34px 0 0')}
    else P(12,88,96,40,shirt,'34px 34px 0 0');
    if(top==='tee'||top==='hoodie')P(47,87,26,9,skin,'0 0 13px 13px',{css:'border-top:none'});
    if(top==='hoodie'){P(48,96,3,16,'var(--paper)','2px',N);P(69,96,3,16,'var(--paper)','2px',N)}
    if(top==='polo'||top==='guaya'){P(43,85,17,11,shirt,'0 0 11px 2px');P(60,85,17,11,shirt,'0 0 2px 11px');P(59,99,3,3,I,'50%',N);P(59,108,3,3,I,'50%',N)}
    if(top==='guaya'){P(36,98,2,24,'var(--color-neutral-400)','1px',N);P(82,98,2,24,'var(--color-neutral-400)','1px',N)}
    if(p.neck==='choker')P(50,74,20,5,I,'2px',N);
    if(p.neck==='cruz'){P(48,80,24,14,T,'0 0 12px 12px',{b:'1.5px solid '+I,css:'border-top:none'});P(58.5,94,3,10,'var(--sun)','1px',{b:'1px solid '+I});P(55.5,96.5,9,3,'var(--sun)','1px',{b:'1px solid '+I})}
    if(p.chain)P(44,84,32,18,T,'0 0 16px 16px',{b:'3px solid var(--sun)',css:'border-top:none'});
    // head
    P(28,50,11,15,skin,'50%');P(81,50,11,15,skin,'50%');
    P(33,24,54,60,skin,'27px 27px 25px 25px');
    if(ear==='argollas'){P(27,62,11,11,T,'50%',{b:'2.5px solid var(--sun)'});P(82,62,11,11,T,'50%',{b:'2.5px solid var(--sun)'})}
    if(ear==='pantallas'){P(30,63,5,5,'var(--sun)','50%',{b:'1.5px solid '+I});P(85,63,5,5,'var(--sun)','50%',{b:'1.5px solid '+I})}
    // face
    P(42,46,12,3,I,'2px',N);P(66,46,12,3,I,'2px',N);
    P(44,52,8,8,I,'50%',N);P(68,52,8,8,I,'50%',N);
    P(48,53,2.5,2.5,'var(--paper)','50%',N);P(72,53,2.5,2.5,'var(--paper)','50%',N);
    P(57,58,6,9,T,'0 0 4px 0',{b:'none',css:'border-right:2px solid '+I+';border-bottom:2px solid '+I});
    P(52,70,16,6,T,'0 0 10px 10px',{b:'none',css:'border-bottom:2.5px solid '+I});
    // hair in front
    if(!p.hat){
      if(hair==='rapado')P(33,22,54,14,hc,'27px 27px 6px 6px');
      else if(hair==='rizos'){P(34,24,52,12,hc,'10px',N);[[29,30],[37,19],[49,15],[61,15],[73,19],[81,30]].forEach(([x,y])=>P(x,y,16,16,hc,'50%'))}
      else if(hair==='trenzas')P(31,18,58,22,stripes('90deg'),'28px 28px 8px 8px');
      else if(hair==='afro')P(26,12,68,26,hc,'34px 34px 12px 12px');
      else if(hair==='mono'){P(47,4,26,20,hc,'50%');P(32,20,56,16,hc,'28px 28px 6px 6px')}
      else if(hair==='largo'){P(31,20,30,20,hc,'28px 4px 4px 12px');P(59,20,30,20,hc,'4px 28px 12px 4px')}
      else if(hair==='cola')P(32,20,56,16,hc,'28px 28px 6px 6px');
      else if(hair==='emo'){P(30,16,60,22,hc,'30px 30px 10px 10px');P(34,28,30,26,hc,'6px 6px 22px 4px')}
      else if(hair==='trenza'){P(31,20,30,20,hc,'28px 4px 4px 12px');P(59,20,30,20,hc,'4px 28px 12px 4px');P(80,52,12,44,stripes('180deg'),'6px')}
      else P(31,18,58,22,hc,'28px 28px 12px 12px');
    }
    if(p.streak&&!p.hat&&hair!=='rapado')P(38,18,7,hair==='emo'?34:20,'var(--color-accent)','4px',N);
    if(p.hat){P(30,14,60,24,'var(--color-accent)','30px 30px 4px 4px');P(80,30,24,8,'var(--color-accent)','3px')}
    if(p.glasses){P(39,49,17,13,T,'5px',{b:'2.5px solid '+I});P(64,49,17,13,T,'5px',{b:'2.5px solid '+I});P(56,54,8,2.5,I,'1px',N)}
    return {size,bw,k,parts,bg:p.bg||'var(--color-accent-2-200)'};
  }
}
</script>
</body>
</html>
