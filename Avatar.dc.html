<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="bloque.css"></helmet>
<div style="position:relative; flex:none; overflow:hidden; box-sizing:border-box; width:{{ size }}px; height:{{ size }}px; border:{{ bw }}px solid var(--ink); border-radius:4px; background:{{ bg }}">
  <div style="position:absolute; left:0; top:0; width:120px; height:120px; transform:scale({{ k }}); transform-origin:0 0">
    <sc-for list="{{ parts }}" as="p" hint-placeholder-count="0"><div style="position:absolute; box-sizing:border-box; display:grid; place-items:center; left:{{ p.x }}px; top:{{ p.y }}px; width:{{ p.w }}px; height:{{ p.h }}px; background:{{ p.bg }}; border:{{ p.b }}; border-top:{{ p.bt }}; border-radius:{{ p.r }}; color:var(--paper); font-family:var(--font-heading); font-weight:900; font-size:18px; line-height:1">{{ p.t }}</div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;skin&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#b98660&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hair&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rapado&quot;,&quot;corto&quot;,&quot;trenzas&quot;,&quot;afro&quot;,&quot;mono&quot;,&quot;largo&quot;],&quot;default&quot;:&quot;corto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hairColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#17140f&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;top&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tee&quot;,&quot;jersey&quot;,&quot;hoodie&quot;,&quot;guaya&quot;],&quot;default&quot;:&quot;tee&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;topColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e5391b&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;chain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#cfe6e2&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p=this.props,size=Number(p.size)||96,bw=size<50?2:3,k=(size-2*bw)/120;
    const skin=p.skin||'#b98660',hc=p.hairColor||'var(--ink)',tc=p.topColor||'var(--color-accent)',hair=p.hair||'corto',top=p.top||'tee';
    const L='3px solid var(--ink)';
    const P=(x,y,w,h,bg,r,o={})=>({x,y,w,h,bg,r:r||'0',b:o.b||L,bt:o.bt||o.b||L,t:o.t||''});
    const parts=[];
    if(hair==='afro')parts.push(P(18,4,84,62,hc,'50%'));
    if(hair==='largo')parts.push(P(24,20,72,78,hc,'30px 30px 10px 10px'));
    if(hair==='mono')parts.push(P(46,2,28,24,hc,'50%'));
    const shirtBg=top==='guaya'?'repeating-linear-gradient(90deg, '+tc+' 0 8px, var(--paper) 8px 11px)':tc;
    if(top==='hoodie')parts.push(P(28,76,64,24,tc,'30px'));
    parts.push(P(12,88,96,44,shirtBg,'34px 34px 0 0'));
    if(top==='jersey')parts.push(P(44,96,32,20,'transparent','0',{b:'none',t:'23'}));
    parts.push(P(50,76,20,16,skin));
    parts.push(P(32,24,56,62,skin,'26px 26px 24px 24px'));
    parts.push(P(45,50,7,7,'var(--ink)','2px',{b:'none'}),P(68,50,7,7,'var(--ink)','2px',{b:'none'}),P(53,68,14,3,'var(--ink)','2px',{b:'none'}));
    if(!p.hat){
      if(hair==='rapado')parts.push(P(32,22,56,12,hc,'26px 26px 4px 4px'));
      else if(hair==='trenzas')parts.push(P(30,18,60,24,'repeating-linear-gradient(90deg, '+hc+' 0 6px, var(--ink) 6px 8px)','26px 26px 8px 8px'));
      else if(hair==='afro')parts.push(P(28,14,64,22,hc,'28px 28px 10px 10px'));
      else parts.push(P(30,18,60,24,hc,'26px 26px 8px 8px'));
    }
    if(p.chain)parts.push(P(42,84,36,20,'transparent','0 0 18px 18px',{b:'3px solid var(--sun)',bt:'none'}));
    if(p.hat){parts.push(P(28,12,64,26,'var(--color-accent)','30px 30px 4px 4px'));parts.push(P(56,30,48,9,'var(--color-accent)','3px'))}
    return {size,bw,k,parts,bg:p.bg||'var(--color-accent-2-200)'};
  }
}
</script>
</body>
</html>
